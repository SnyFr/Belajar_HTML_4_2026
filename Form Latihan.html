<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout dengan elemen semantik</title>
    <style>
        body {
            background-color: #f4f6f9;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 40px 20px;
            color: #333;
        }

        header>h1 {
            margin-top: 0;
            text-align: center;
            color: #2c3e50;
        }

        nav {
            text-align: center;
            margin-bottom: 25px
        }

        nav a {
            color: #0066cc;
            text-decoration: none;
            font-weight: 500;
        }

        nav a:hover {
            text-decoration: underline;
        }

        p {
            text-align: center;
        }

        fieldset {
            background-color: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 25px 40px;
            margin: 0;

        }

        legend {
            font-weight: bold;
            color: #2c3e50;
            padding: 0 8px;
        }

        fieldset>div {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;

        }

        form {
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding: 30px;

            .form-group {
                width: 100%;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 6px;
                font-size: 14px;
                transition: border-color 0.2s;
                align-items: stretch;

                .Option {
                    display: flex;
                    flex-wrap: wrap;
                    flex-direction: column;
                    gap: 1px;
                    margin-top: 5px;
                    cursor: pointer;
                }

                .Option input {
                    width: 16px;
                    height: 16px;
                    cursor: pointer;
                    accent-color: #FF0000;
                }


            }

        }

        input[type="text"] :focus,
        input[type="date"] :focus,
        select :focus,
        textarea :focus {
            outline: none;
            border-color: #0066cc;
        }

        .InputCheckbox label,
        .Radio label {
            font-weight: bold;
            display: flex;
            gap: 6px;
            cursor: pointer;
        }

        .button-group {
            gap: 10px;
            margin-top: 10px;
        }

        button[type="submit"] {
            background-color: #0066cc;
            color: #ffffff;
        }

        button[type="reset"] {
            background-color: #070707;
            color: #ffffff;
        }

        button[type="submit"]:hover {
            background-color: #115011;
        }

        button[type="reset"]:hover {
            background-color: #b1b1b1;
        }

        .button-group button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        footer {
            padding-top: 20px;
            font-size: smaller;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background-color: #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            padding: 30px;
            border-radius: 12px;

        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Isi form Pendaftaran Mahasiswa</h1>
        </header>
        <p>Tolong diisi pendaftaran berikut:</p>
        <nav>
            <a href="a">Home</a> |
            <a href="a">About</a> |
            <a href="a">Login</a>
        </nav>


        <form action="Insert.php" method="post" enctype="multipart/form-data">
            <fieldset>
                <legend>Form Biodata</legend>
                <div class="form-group">
                    <label for="name">Name : </label>
                    <input type="text" id="name" placeholder="Enter Your Name" name="name">
                </div>
                <div class="form-group">
                    <label for="">Tanggal Lahir : </label>
                    <input type="date" name="tanggal">
                </div>
                <div class="form-group">
                    <label for="">Umur : </label>
                    <input type="number" placeholder="Enter Your Age">
                </div>
                <div class="form-group">
                    <label for="">No Telp/Hp : </label>
                    <input type="tel" placeholder="Enter Your Phone Number" name="hp">
                </div>
                <div class="form-group">
                    <label for="">Hobi (Boleh pilih banyak) : </label>
                    <div class="Option">
                        <label for=""><input type="checkbox" name="Hobi[]"> Berenang</label>
                        <label for=""><input type="checkbox" name="Hobi[]"> Memasak</label>
                        <label for=""><input type="checkbox" name="Hobi[]"> Mancing</label>
                        <label for=""><input type="checkbox" name="Hobi[]"> Futsal</label>
                    </div>
                </div>
                <div class="form-group">
                    <label for="">Jenis Kelamin : </label>
                    <div class="Option">
                        <label for=""><input type="radio" name="jeniskelamin" checked>Laki-Laki</label>
                        <label for=""><input type="radio" name="jeniskelamin">Perempuan</label>
                    </div>
                </div>
                <div class="form-group">
                    <label for="">Jurusan : </label>
                    <select name="" id="">
                        <option value="">--Choose Your Major--</option>
                        <option value="informatika">Informatika</option>
                        <option value="sisteminformasi">Sistem Informasi</option>
                        <option value="teknikkimia">Teknik Kimia</option>
                        <option value="arsitektur">Arsitektur</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="">Foto : </label>
                    <input type="file" name="Foto">
                </div>
                <div class="form-group">
                    <label for="">Alamat : </label>
                    <textarea name="alamat" cols="40" rows="6" placeholder="Enter Your Address"></textarea>

                </div>
                <div class="button-group">
                    <!-- <input type="submit" value="Submit Form"> -->
                    <button type="submit"> Submit</button>
                    <button type="reset"> Ulangi</button>
                </div>
            </fieldset>
        </form>
    </div>

    <footer>Copyright 2026 | All Rights Reserved</footer>
</body>

</html>
